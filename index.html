const SPINNER_FRAMES = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"];

function useSpinnerFrame(ms = 90) {
  const [i, setI] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setI(x => (x + 1) % SPINNER_FRAMES.length), ms);
    return () => clearInterval(t);
  }, [ms]);
  return SPINNER_FRAMES[i];
}

function Spinner({ color = "var(--info)" }) {
  const f = useSpinnerFrame();
  return <span style={{ color, display: "inline-block", width: 14, textAlign: "center", fontSize: 12.5, lineHeight: 1 }}>{f}</span>;
}

function StateGlyph({ state }) {
  const meta = STATE_META[state] || STATE_META.idle;
  if (meta.spinner) return <Spinner color={meta.color} />;
  return (
    <span style={{
      color: meta.color, display: "inline-block", width: 14, textAlign: "center",
      fontSize: 12.5, lineHeight: 1, fontFamily: "var(--mono)",
    }}>{meta.glyph}</span>
  );
}

function Dot({ color = "var(--ok)", size = 7 }) {
  return (
    <span style={{
      display: "inline-block", width: size, height: size, borderRadius: 99,
      background: color, flexShrink: 0,
    }} />
  );
}

function StatePill({ state }) {
  const meta = STATE_META[state] || STATE_META.idle;
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      padding: "1px 7px 1px 5px",
      border: `1px solid ${meta.color}`, color: meta.color,
      borderRadius: 2, fontSize: 11, letterSpacing: "0.04em",
      textTransform: "uppercase", background: "transparent", lineHeight: 1.5,
    }}>
      <StateGlyph state={state} />
      {meta.label}
    </span>
  );
}

function Panel({ title, right, children, pad = 12, style, accent, focused, scrollable, contentRef, onClick, headerless }) {
  const borderColor = accent ? "var(--accent-dim)" : focused ? "var(--accent)" : "var(--border)";
  return (
    <div onClick={onClick} style={{
      border: `1px solid ${borderColor}`, background: "var(--bg)",
      display: "flex", flexDirection: "column", minHeight: 0, overflow: "hidden",
      transition: "border-color 90ms linear", ...style,
    }}>
      {!headerless && (title || right) && (
        <div style={{
          display: "flex", alignItems: "center", justifyContent: "space-between",
          padding: "5px 12px", borderBottom: "1px solid var(--border)", flexShrink: 0,
          background: focused ? "var(--accent-faint)" : "transparent", gap: 12,
        }}>
          <span style={{
            fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase",
            color: accent || focused ? "var(--accent)" : "var(--text-dim)", fontWeight: 500,
          }}>{title}</span>
          {right ? <span style={{ fontSize: 11, color: "var(--text-faint)" }}>{right}</span> : null}
        </div>
      )}
      <div ref={contentRef}
        style={{ padding: pad, flex: 1, minHeight: 0, overflow: scrollable ? "auto" : "hidden" }}>
        {children}
      </div>
    </div>
  );
}

function Key({ k, label, onClick, accent }) {
  return (
    <span onClick={onClick} style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      cursor: onClick ? "pointer" : "default", userSelect: "none",
    }}>

        display: "inline-block", padding: "0 6px",
        background: accent ? "var(--accent-faint)" : "var(--surface-2)",
        border: `1px solid ${accent ? "var(--accent-dim)" : "var(--border)"}`,
        color: accent ? "var(--accent)" : "var(--text-dim)",
        fontSize: 10.5, lineHeight: "16px", height: 16, borderRadius: 2,
        minWidth: 16, textAlign: "center", fontWeight: 600,
      }}>{k}</span>
      <span style={{ color: "var(--text-dim)", fontSize: 11 }}>{label}</span>
    </span>
  );
}

function Spark({ values, width = 28, color = "var(--accent)" }) {
  const chars = "▁▂▃▄▅▆▇█";
  const max = Math.max(...values, 1);
  const last = values.slice(-width);
  return (
    <span style={{ color, letterSpacing: -1, whiteSpace: "pre" }}>
      {last.map(v => chars[Math.min(7, Math.floor((v / max) * 7))]).join("")}
    </span>
  );
}

function Bar({ pct, width = 18, color = "var(--accent)", track = "var(--surface-3)" }) {
  const filled = Math.max(0, Math.min(width, Math.round((pct / 100) * width)));
  return (
    <span style={{ whiteSpace: "pre", letterSpacing: -1 }}>
      <span style={{ color }}>{"█".repeat(filled)}</span>
      <span style={{ color: track }}>{"░".repeat(width - filled)}</span>
    </span>
  );
}

function useClock() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  return now;
}

function BrandMark() {

      fontFamily: "var(--mono)", letterSpacing: "0.04em", fontWeight: 600,

      <span style={{ color: "var(--text-faint)", marginLeft: 4, fontWeight: 400 }}>· agent daemon</span>
    </span>
  );
}

function KV({ k, v, c }) {

      <span style={{ color: c || "var(--text)" }} className="tui-num">{v}</span>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
 * useListNav — generic list keyboard nav (j/k, gg/G, ⌃d/⌃u, Enter, Esc, +action)
 * ═══════════════════════════════════════════════════════════════════════════ */
function useListNav(itemsLen, opts = {}) {
  const { onOpen, onEsc, onAction, scopeReady = true } = opts;
  const [sel, setSel] = useState(0);
  const [pendingG, setPendingG] = useState(false);

  useEffect(() => { if (sel >= itemsLen) setSel(Math.max(0, itemsLen - 1)); }, [itemsLen, sel]);

  useEffect(() => {
    if (!scopeReady) return;
    const handler = (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "j" || e.key === "ArrowDown") {
        setSel(s => Math.min(itemsLen - 1, s + 1)); e.preventDefault(); setPendingG(false); return;
      }
      if (e.key === "k" || e.key === "ArrowUp") {
        setSel(s => Math.max(0, s - 1)); e.preventDefault(); setPendingG(false); return;
      }
      if (e.key === "G") { setSel(itemsLen - 1); e.preventDefault(); setPendingG(false); return; }
      if (e.key === "g") {
        if (pendingG) { setSel(0); setPendingG(false); e.preventDefault(); }
        else setPendingG(true);
        return;
      }
      if ((e.key === "d" || e.key === "u") && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        const half = Math.max(1, Math.floor(itemsLen / 8));
        setSel(s => Math.max(0, Math.min(itemsLen - 1, s + (e.key === "d" ? half : -half))));
        return;
      }
      if (e.key === "Enter" || e.key === "ArrowRight") { onOpen?.(sel); e.preventDefault(); return; }
      if (e.key === "Escape") { onEsc?.(); return; }
      if (onAction) onAction(e, sel);
      setPendingG(false);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [itemsLen, sel, onOpen, onEsc, onAction, scopeReady, pendingG]);

  return [sel, setSel];
}

function OverviewView({ daemon, onJump }) {
  const [focusIdx, setFocusIdx] = useState(0);
  useEffect(() => {
    const handler = (e) => {
      if (e.target.tagName === "INPUT") return;
      const cur = OV_CARDS[focusIdx];
      if (!cur) return;
      const move = (dr, dc) => {
        const target = OV_CARDS.find(c => c.row === cur.row + dr && c.col === cur.col + dc);
        if (target) { setFocusIdx(OV_CARDS.indexOf(target)); e.preventDefault(); }
      };
      if      (e.key === "ArrowDown"  || e.key === "j") move(1, 0);
      else if (e.key === "ArrowUp"    || e.key === "k") move(-1, 0);
      else if (e.key === "ArrowRight" || e.key === "l") move(0, 1);
      else if (e.key === "ArrowLeft"  || e.key === "h") move(0, -1);
      else if (e.key === "Enter") { onJump?.(cur.jump); e.preventDefault(); }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [focusIdx, onJump]);

  const counts = useMemo(() => {
    const c = { needs_input: 0, working: 0, running: 0, idle: 0, completed: 0, failed: 0, paused: 0 };

  const cardProps = (id) => {
    const idx = OV_CARDS.findIndex(c => c.id === id);
    return {
      focused: focusIdx === idx,
      onClick: () => setFocusIdx(idx),
      title: OV_CARDS[idx].title,

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1.05fr 1.05fr 0.9fr", gridTemplateRows: "auto 1fr", gap: 12, height: "100%" }}>

const SESSION_FILTERS = ["all", "needs_input", "working", "running", "paused", "idle", "completed", "failed"];

function SessionsView({ initialFilter, onAttach }) {
  const [filter, setFilter] = useState(initialFilter || "all");
  const [query, setQuery] = useState("");
  const queryRef = useRef(null);

  const rows = useMemo(() => {
    return SESSIONS
      .filter(s => filter === "all" || s.state === filter)
      .filter(s => !query || (s.title + s.issue + s.id).toLowerCase().includes(query.toLowerCase()))
      .sort((a, b) => (STATE_META[a.state]?.sort ?? 9) - (STATE_META[b.state]?.sort ?? 9));
  }, [filter, query]);

  const [sel, setSel] = useListNav(rows.length, {
    onOpen: (i) => rows[i] && onAttach(rows[i].id),
    onEsc:  () => { if (query) setQuery(""); else if (filter !== "all") setFilter("all"); },
    onAction: (e) => {
      if (e.key === "[" || e.key === "]") {
        const ix = SESSION_FILTERS.indexOf(filter);
        const next = (ix + (e.key === "]" ? 1 : -1) + SESSION_FILTERS.length) % SESSION_FILTERS.length;
        setFilter(SESSION_FILTERS[next]);
        e.preventDefault();
      }
      if (e.key === "*") {
        const start = sel + 1;
        const ix = rows.findIndex((r, i) => i >= start && r.state === "needs_input");
        const found = ix === -1 ? rows.findIndex(r => r.state === "needs_input") : ix;
        if (found !== -1) setSel(found);
        e.preventDefault();
      }
      if (e.key === "/") { queryRef.current?.focus(); e.preventDefault(); }
    },
  });

  const counts = useMemo(() => {
    const c = { all: SESSIONS.length };
    SESSIONS.forEach(s => { c[s.state] = (c[s.state] || 0) + 1; });
    return c;
  }, []);

  const selSession = rows[sel];

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr", gap: 12, height: "100%" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, minHeight: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
          {SESSION_FILTERS.map(f => {
            const active = f === filter;
            const meta = f === "all" ? null : STATE_META[f];
            return (
              <button key={f} onClick={() => setFilter(f)}
                style={{
                  background: active ? "var(--accent-faint)" : "transparent",
                  border: `1px solid ${active ? "var(--accent-dim)" : "var(--border)"}`,
                  color: active ? "var(--accent)" : (meta?.color || "var(--text-dim)"),
                  fontFamily: "var(--mono)", fontSize: 11.5,
                  padding: "3px 9px", cursor: "pointer", borderRadius: 2,
                  display: "inline-flex", alignItems: "center", gap: 6,
                }}>
                {meta && (meta.spinner ? <Spinner color={meta.color} /> : <span style={{ color: meta.color }}>{meta.glyph}</span>)}
                <span>{f === "all" ? "all" : meta.label}</span>
                <span className="tui-num" style={{ color: "var(--text-faint)" }}>{counts[f] || 0}</span>
              </button>
            );
          })}
          <span style={{ display: "inline-flex", alignItems: "center", gap: 4, marginLeft: 4, fontSize: 10.5, color: "var(--text-mute)" }}>
            <span style={{ padding: "0 4px", border: "1px solid var(--border)", borderRadius: 2 }}>[</span>
            <span style={{ padding: "0 4px", border: "1px solid var(--border)", borderRadius: 2 }}>]</span>
            <span>cycle</span>
          </span>
          <div style={{ flex: 1 }} />
          <span style={{ display: "inline-flex", alignItems: "center", gap: 6, border: "1px solid var(--border)", padding: "3px 8px", borderRadius: 2 }}>
            <span style={{ color: "var(--text-faint)", fontSize: 11 }}>/</span>
            <input ref={queryRef} value={query} onChange={e => setQuery(e.target.value)} placeholder="filter sessions…"
              style={{ background: "transparent", border: 0, outline: 0, color: "var(--text)", fontFamily: "var(--mono)", fontSize: 12, width: 160 }} />
          </span>
        </div>

        <Panel title={`sessions · ${rows.length}`}
          right={<span style={{ color: "var(--text-faint)" }}>sort · needs-you first</span>}
          style={{ flex: 1, minHeight: 0 }} pad={0} scrollable>
          <SessionTable rows={rows} sel={sel} setSel={setSel} onAttach={onAttach} />
        </Panel>
      </div>

      <SessionPeek session={selSession} onAttach={onAttach} />
    </div>
  );
}

function SessionTable({ rows, sel, setSel, onAttach }) {
  const containerRef = useRef(null);
  const selRef = useRef(null);
  useEffect(() => {
    if (selRef.current && containerRef.current) {
      const c = containerRef.current, el = selRef.current;
      const top = el.offsetTop, bot = top + el.offsetHeight;
      const cTop = c.scrollTop + 28, cBot = c.scrollTop + c.clientHeight - 8;
      if (top < cTop) c.scrollTop = top - 28;
      else if (bot > cBot) c.scrollTop = bot - c.clientHeight + 8;
    }
  }, [sel]);

  return (
    <div ref={containerRef} style={{ fontSize: 12.5, fontFamily: "var(--mono)", height: "100%", overflowY: "auto" }}>
      <div style={{
        display: "grid",
        gridTemplateColumns: "26px 84px minmax(0, 1.7fr) 130px 130px 80px 72px",
        padding: "8px 12px",
        color: "var(--text-faint)", fontSize: 10.5, textTransform: "uppercase", letterSpacing: "0.08em",
        borderBottom: "1px solid var(--border)", position: "sticky", top: 0, background: "var(--bg)", zIndex: 1,
      }}>
        <span /><span>issue</span><span>title · activity</span><span>agent</span><span>workspace</span>
        <span style={{ textAlign: "right" }}>elapsed</span><span style={{ textAlign: "right" }}>cost</span>
      </div>
      {rows.map((s, i) => {
        const selected = i === sel;
        return (
          <div key={s.id}
            ref={selected ? selRef : null}
            className={`tui-row ${selected ? "sel-accent" : ""}`}
            onClick={() => setSel(i)}
            onDoubleClick={() => onAttach(s.id)}
            style={{
              display: "grid",
              gridTemplateColumns: "26px 84px minmax(0, 1.7fr) 130px 130px 80px 72px",
              padding: "8px 12px",
              borderLeft: `2px solid ${selected ? "var(--accent)" : "transparent"}`,
              cursor: "pointer", alignItems: "center",
            }}>
            <StateGlyph state={s.state} />
            <span style={{ color: "var(--text-dim)" }}>{s.issue}</span>
            <span style={{ minWidth: 0 }}>
              <div style={{ color: "var(--text)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.title}</div>
              <div style={{ color: s.state === "needs_input" ? "var(--warn)" : "var(--text-faint)", fontSize: 11.5, marginTop: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.activity}</div>
            </span>
            <span style={{ color: "var(--text-dim)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.agent}<span style={{ color: "var(--text-mute)" }}> · {s.model}</span></span>
            <span style={{ color: "var(--text-faint)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.workspace}</span>
            <span className="tui-num" style={{ color: "var(--text-dim)", textAlign: "right" }}>{s.elapsed}</span>
            <span className="tui-num" style={{ color: "var(--text-dim)", textAlign: "right" }}>{s.cost}</span>
          </div>
        );
      })}
    </div>
  );
}

function SessionPeek({ session, onAttach }) {
  if (!session) return <Panel title="peek"><div style={{ color: "var(--text-faint)" }}>no session selected</div></Panel>;
  return (
    <Panel title="peek"
      right={<span><span style={{ color: "var(--text-faint)" }}>↵</span> <span style={{ color: "var(--accent)" }}>attach</span></span>}
      style={{ minHeight: 0 }} scrollable accent={session.state === "needs_input"}>
      <div style={{ fontFamily: "var(--mono)", fontSize: 12.5 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
          <StatePill state={session.state} />
          <span style={{ color: "var(--text-faint)" }} className="tui-num">{session.id}</span>
          <span style={{ marginLeft: "auto", color: "var(--text-faint)" }}>{session.issue}</span>
        </div>
        <div style={{ color: "var(--text)", marginBottom: 10, fontSize: 13.5, fontWeight: 500 }}>{session.title}</div>

        <div style={{ display: "grid", gridTemplateColumns: "70px 1fr", rowGap: 3, columnGap: 8, fontSize: 12, marginBottom: 10 }}>
          <span style={{ color: "var(--text-faint)" }}>agent</span>     <span>{session.agent}<span style={{ color: "var(--text-faint)" }}> · {session.model}</span></span>
          <span style={{ color: "var(--text-faint)" }}>workspace</span> <span>{session.workspace}</span>
          <span style={{ color: "var(--text-faint)" }}>branch</span>    <span style={{ color: "var(--violet)" }}>{session.branch}</span>
          <span style={{ color: "var(--text-faint)" }}>started</span>   <span className="tui-num">{session.started}</span>
          <span style={{ color: "var(--text-faint)" }}>elapsed</span>   <span className="tui-num">{session.elapsed}</span>
          <span style={{ color: "var(--text-faint)" }}>tokens</span>    <span className="tui-num">{session.tokensIn.toLocaleString()} in · {session.tokensOut.toLocaleString()} out</span>
          <span style={{ color: "var(--text-faint)" }}>cost</span>      <span className="tui-num">{session.cost}</span>
        </div>

        {session.question && (
          <div style={{ border: "1px solid var(--accent-dim)", background: "var(--accent-faint)", padding: 10, marginBottom: 10 }}>
            <div style={{ fontSize: 11, color: "var(--accent)", letterSpacing: "0.05em", textTransform: "uppercase", marginBottom: 5 }}>
              <StateGlyph state="needs_input" /> waiting on you
            </div>
            <div style={{ color: "var(--text)", lineHeight: 1.5 }}>{session.question}</div>
          </div>
        )}

        {session.log && (
          <div>
            <div style={{ fontSize: 11, color: "var(--text-faint)", textTransform: "uppercase", letterSpacing: "0.05em", margin: "8px 0 4px" }}>recent</div>
            {session.log.map((l, i) => (
              <div key={i} style={{ padding: "2px 0", display: "flex", gap: 8 }}>
                <span style={{ color: "var(--text-faint)", width: 60, flexShrink: 0, fontSize: 11.5 }}>{l[0]}</span>
                <span style={{ color: l[0] === "ask" ? "var(--warn)" : l[0] === "tool" ? "var(--info)" : "var(--text-dim)" }}>{l[1]}</span>
                <span style={{ color: "var(--text-faint)" }}>{l[2]}</span>
              </div>
            ))}
          </div>
        )}

        <div style={{ marginTop: 14, display: "flex", flexWrap: "wrap", gap: 10 }}>
          <Key k="↵" label="attach" accent onClick={() => onAttach(session.id)} />
          <Key k="r" label="reply" />
          <Key k="b" label="background" />
          <Key k="x" label="cancel" />
          <Key k="*" label="next needs-input" />
        </div>
      </div>
    </Panel>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
 * SESSION ATTACH
 * ═══════════════════════════════════════════════════════════════════════════ */

function SessionAttachView({ sessionId, onDetach }) {
  const s = SESSIONS.find(x => x.id === sessionId) || SESSIONS[0];
  const [reply, setReply] = useState("");

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 280px", gap: 12, height: "100%" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, minHeight: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "4px 2px" }}>
          <Key k="←" label="detach" onClick={onDetach} accent />
          <StatePill state={s.state} />
          <span style={{ color: "var(--text-faint)" }}>{s.issue}</span>
          <span style={{ color: "var(--text)" }}>· {s.title}</span>
          <span style={{ marginLeft: "auto", color: "var(--text-faint)", fontSize: 11.5 }} className="tui-num">{s.id} · elapsed {s.elapsed}</span>
        </div>

        <Panel title="transcript" right={<span style={{ color: "var(--text-faint)" }}>j/k scroll · g top · G bottom</span>} style={{ flex: 1, minHeight: 0 }} pad={0} scrollable>
          <TranscriptStream />
        </Panel>

        <div style={{
          border: `1px solid ${s.state === "needs_input" ? "var(--accent-dim)" : "var(--border)"}`,
          background: "var(--bg)", padding: 10,
        }}>
          <div style={{ fontSize: 11, color: "var(--text-faint)", marginBottom: 6, display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ color: "var(--accent)" }}>›</span> reply to <span style={{ color: "var(--text-dim)" }}>{s.id}</span>
            <span style={{ marginLeft: "auto" }}><Key k="↵" label="send" /></span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ color: "var(--accent)" }}>›</span>
            <input value={reply} onChange={e => setReply(e.target.value)}
              placeholder={s.state === "needs_input" ? "(a) refactor the dispatcher first, then teardown" : "type a message…"}
              style={{ flex: 1, background: "transparent", border: 0, outline: 0, color: "var(--text)", fontFamily: "var(--mono)", fontSize: 13 }} />
            <span className="tui-caret" style={{ color: "var(--accent)" }}>▌</span>
          </div>
        </div>
      </div>

      <SessionAttachSidebar s={s} />
    </div>
  );
}

function TranscriptStream() {
  return (
    <div style={{ fontSize: 13, fontFamily: "var(--mono)", lineHeight: 1.55, padding: "8px 14px" }}>
      {SESSION_TRANSCRIPT.map((e, i) => <TranscriptEntry key={i} e={e} />)}
      <div style={{ color: "var(--text-faint)", marginTop: 8, display: "flex", alignItems: "center", gap: 6 }}>
        <StateGlyph state="needs_input" />
        <span style={{ color: "var(--accent)" }}>waiting for you</span>
        <span>· 02:11 idle</span>
      </div>
    </div>
  );
}

function TranscriptEntry({ e }) {
  if (e.kind === "user") {
    return (
      <div style={{ padding: "10px 0", borderBottom: "1px dashed var(--border)" }}>
        <div style={{ color: "var(--accent)", fontSize: 11, letterSpacing: "0.05em", marginBottom: 2 }}>YOU · {e.time}</div>
        <div style={{ color: "var(--text)" }}>{e.body}</div>
      </div>
    );
  }
  if (e.kind === "plan") {
    return (
      <div style={{ padding: "10px 0" }}>
        <div style={{ color: "var(--violet)", fontSize: 11, letterSpacing: "0.05em", marginBottom: 4 }}>◇ PLAN · {e.time}</div>
        <pre style={{ margin: 0, color: "var(--text-dim)", fontFamily: "var(--mono)", fontSize: 12.5, whiteSpace: "pre-wrap" }}>{e.body}</pre>
      </div>
    );
  }
  if (e.kind === "tool") {
    return (
      <div style={{ padding: "3px 0", display: "flex", gap: 8, alignItems: "center" }}>
        <span style={{ color: "var(--text-faint)", width: 64, fontSize: 11.5 }} className="tui-num">{e.time}</span>
        <Dot color="var(--info)" />
        <span style={{ color: "var(--info)" }}>{e.tool}</span>
        <span style={{ color: "var(--text-dim)" }}>{e.arg}</span>
      </div>
    );
  }
  if (e.kind === "thinking") {
    return (
      <div style={{ padding: "6px 0 6px 72px", borderLeft: "1px dashed var(--border)", marginLeft: 4, color: "var(--text-faint)", fontStyle: "italic", fontSize: 12.5 }}>
        {e.body}
      </div>
    );
  }
  if (e.kind === "ask") {
    return (
      <div style={{ marginTop: 12, padding: 12, border: "1px solid var(--accent-dim)", background: "var(--accent-faint)" }}>
        <div style={{ color: "var(--accent)", fontSize: 11, letterSpacing: "0.05em", marginBottom: 4, display: "inline-flex", alignItems: "center", gap: 6 }}>
          <StateGlyph state="needs_input" /> QUESTION · {e.time}
        </div>
        <pre style={{ margin: 0, color: "var(--text)", whiteSpace: "pre-wrap", fontFamily: "var(--mono)", fontSize: 13 }}>{e.body}</pre>
      </div>
    );
  }
  return null;
}

function SessionAttachSidebar({ s }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10, minHeight: 0 }}>
      <Panel title="run">
        <div style={{ fontSize: 12, lineHeight: 1.7 }}>
          <KV k="session" v={s.id} />
          <KV k="agent"   v={`${s.agent} · ${s.model}`} />
          <KV k="branch"  v={s.branch} c="var(--violet)" />
          <KV k="started" v={s.started} />
          <KV k="elapsed" v={s.elapsed} />
        </div>
      </Panel>
      <Panel title="budget">
        <div style={{ fontSize: 12, lineHeight: 1.7 }}>
          <KV k="in"     v={s.tokensIn.toLocaleString()} />
          <KV k="out"    v={s.tokensOut.toLocaleString()} />
          <KV k="cost"   v={s.cost} c="var(--accent)" />
          <KV k="cap"    v="$5.00" />
          <div style={{ marginTop: 6 }}>
            <Bar pct={Math.min(100, parseFloat(s.cost.replace("$","")) / 5 * 100)} width={22} color="var(--accent)" />
          </div>

      </Panel>
      <Panel title="actions" style={{ flex: 1 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 12 }}>
          <Key k="r" label="reply" />
          <Key k="b" label="background" />
          <Key k="t" label="open log tail" />
          <Key k="d" label="diff for this run" />

}

/* ═══════════════════════════════════════════════════════════════════════════
 * ISSUES (3)
 * ═══════════════════════════════════════════════════════════════════════════ */

const ISSUE_FILTERS = ["all", "active", "todo", "in_progress", "in_review", "blocked", "done", "backlog"];

function IssuesView() {
  const [statusF, setStatusF] = useState("active");

  const rows = useMemo(() => {
    return ISSUES.filter(i => {
      if (statusF === "all") return true;
      if (statusF === "active") return ["todo", "in_progress", "in_review", "blocked"].includes(i.status);
      return i.status === statusF;
    });
  }, [statusF]);

  const [sel] = useListNav(rows.length, {
    onAction: (e) => {
      if (e.key === "[" || e.key === "]") {
        const ix = ISSUE_FILTERS.indexOf(statusF);
        setStatusF(ISSUE_FILTERS[(ix + (e.key === "]" ? 1 : -1) + ISSUE_FILTERS.length) % ISSUE_FILTERS.length]);
        e.preventDefault();
      }
    },
  });

  return (
    <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 12, height: "100%" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, minHeight: 0 }}>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
          {ISSUE_FILTERS.map(f => (
            <button key={f} onClick={() => setStatusF(f)}
              style={{
                background: f === statusF ? "var(--accent-faint)" : "transparent",
                border: `1px solid ${f === statusF ? "var(--accent-dim)" : "var(--border)"}`,
                color: f === statusF ? "var(--accent)" : "var(--text-dim)",
                fontFamily: "var(--mono)", fontSize: 11.5,
                padding: "3px 9px", cursor: "pointer", borderRadius: 2,
              }}>{f}</button>
          ))}
          <span style={{ marginLeft: 4, fontSize: 10.5, color: "var(--text-mute)" }}>[ ] cycle</span>
          <div style={{ flex: 1 }} />
          <Key k="n" label="new" accent />
          <Key k="a" label="assign" />
          <Key k="s" label="status" />
        </div>
        <Panel title={`issues · ${rows.length}`} style={{ flex: 1, minHeight: 0 }} pad={0} scrollable>
          <div style={{ height: "100%", overflowY: "auto", fontSize: 12.5 }}>
            <div style={{
              display: "grid",
              gridTemplateColumns: "26px 80px minmax(0, 1.6fr) 110px 100px 140px 50px",
              padding: "8px 12px",
              color: "var(--text-faint)", fontSize: 10.5, textTransform: "uppercase", letterSpacing: "0.08em",
              borderBottom: "1px solid var(--border)", position: "sticky", top: 0, background: "var(--bg)", zIndex: 1,
            }}>
              <span /><span>id</span><span>title</span><span>status</span><span>priority</span><span>assignee</span><span style={{ textAlign: "right" }}>upd</span>
            </div>
            {rows.map((it, i) => {
              const ps = PRIORITY_META[it.priority];
              const ss = STATUS_META[it.status];
              return (
                <div key={it.id} className={`tui-row ${i === sel ? "sel-accent" : ""}`}
                  style={{
                    display: "grid", gridTemplateColumns: "26px 80px minmax(0, 1.6fr) 110px 100px 140px 50px",
                    padding: "8px 12px", borderLeft: `2px solid ${i === sel ? "var(--accent)" : "transparent"}`,
                    cursor: "pointer", alignItems: "center",
                  }}>
                  <span style={{ color: ps.color, width: 14, display: "inline-block", textAlign: "center" }}>{ps.glyph}</span>
                  <span style={{ color: "var(--text-dim)" }} className="tui-num">{it.id}</span>
                  <span style={{ color: "var(--text)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{it.title}</span>
                  <span style={{ color: ss.color }}>{it.status}</span>
                  <span style={{ color: ps.color, textTransform: "lowercase" }}>{it.priority}</span>
                  <span style={{ color: "var(--text-faint)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{it.assignee}</span>
                  <span style={{ color: "var(--text-faint)", textAlign: "right" }} className="tui-num">{it.updated}</span>
                </div>
              );
            })}
          </div>
        </Panel>
      </div>
      <IssueDetail it={rows[sel] || ISSUES[0]} />
    </div>
  );
}

function IssueDetail({ it }) {
  const ss = STATUS_META[it.status];
  return (
    <Panel title={it.id} right={<span style={{ color: ss.color }}>{it.status}</span>} style={{ minHeight: 0 }} scrollable>
      <div style={{ fontSize: 12.5 }}>
        <div style={{ fontSize: 14, color: "var(--text)", fontWeight: 500, marginBottom: 8 }}>{it.title}</div>
        <KV k="status"    v={it.status} c={ss.color} />
        <KV k="priority"  v={it.priority} c={PRIORITY_META[it.priority].color} />

          <RunRow state="running"   id="t_8fa1" sub="claude · started 16:02 · 39m" />

          <Key k="↵" label="open run" accent />
          <Key k="a" label="assign" />
          <Key k="s" label="status" />
          <Key k="c" label="comment" />
        </div>
      </div>

}

function RunRow({ state, id, sub }) {

    <div style={{ padding: "4px 0", borderBottom: "1px dashed var(--border)", display: "flex", gap: 8, alignItems: "center" }}>

/* ═══════════════════════════════════════════════════════════════════════════
 * RUNTIMES (4)

function RuntimesView() {
  const [sel] = useListNav(RUNTIMES.length);
  const cur = RUNTIMES[sel];

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1.8fr 1fr", gap: 12, height: "100%" }}>
      <Panel title="agent runtimes" right={<span style={{ color: "var(--text-faint)" }}>auto-detected on $PATH</span>} style={{ minHeight: 0 }} pad={0} scrollable>
        <div style={{ overflowY: "auto", height: "100%" }}>
          <div style={{
            display: "grid",
            gridTemplateColumns: "20px 110px 70px minmax(0, 1.2fr) 110px 80px 70px 80px",
            padding: "8px 12px",
            color: "var(--text-faint)", fontSize: 10.5, textTransform: "uppercase", letterSpacing: "0.08em",
            borderBottom: "1px solid var(--border)", position: "sticky", top: 0, background: "var(--bg)", zIndex: 1,
          }}>
            <span /><span>cli</span><span>ver</span><span>path</span><span>model</span><span>status</span>
            <span style={{ textAlign: "right" }}>in/cap</span><span style={{ textAlign: "right" }}>last used</span>
          </div>

            const c = r.status === "ready" ? "var(--ok)"
                    : r.status === "stale" ? "var(--warn)"

                    : "var(--text-faint)";
            const dotGlyph = r.status === "ready" ? "●"
                           : r.status === "stale" ? "◐"
                           : r.status === "not_found" ? "✕"
                           : "○";
            return (
              <div key={r.cli} className={`tui-row ${i === sel ? "sel-accent" : ""}`}
                style={{
                  display: "grid",
                  gridTemplateColumns: "20px 110px 70px minmax(0, 1.2fr) 110px 80px 70px 80px",
                  padding: "8px 12px", alignItems: "center", fontSize: 12.5,
                  borderLeft: `2px solid ${i === sel ? "var(--accent)" : "transparent"}`,
                }}>
                <span style={{ color: c, width: 14, display: "inline-block", textAlign: "center" }}>{dotGlyph}</span>
                <span style={{ color: r.status === "not_found" ? "var(--text-mute)" : "var(--text)" }}>{r.cli}</span>
                <span style={{ color: "var(--text-dim)" }} className="tui-num">{r.version}</span>
                <span style={{ color: "var(--text-faint)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.path}</span>
                <span style={{ color: "var(--text-dim)" }}>{r.model}</span>
                <span style={{ color: c }}>{r.status === "not_found" ? "missing" : r.status}</span>
                <span className="tui-num" style={{ color: "var(--text-dim)", textAlign: "right" }}>{r.inflight}/{r.cap}</span>
                <span style={{ color: "var(--text-faint)", textAlign: "right" }}>{r.lastUsed}</span>
              </div>
            );
          })}
        </div>
      </Panel>

      <Panel title={cur ? `runtime · ${cur.cli}` : "runtime"} style={{ minHeight: 0 }} scrollable>
        <RuntimeDetail r={cur} />
      </Panel>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
 * LOGS (6)
 * ═══════════════════════════════════════════════════════════════════════════ */

function LogsView() {
  const [level, setLevel] = useState("all");
  const [follow, setFollow] = useState(true);
  const ref = useRef(null);

  const rows = useMemo(() => LOG_LINES.filter(l => level === "all" || l[1] === level), [level]);

  const levels = ["all", "INFO", "DEBUG", "WARN", "ERROR"];

  useEffect(() => {
    const handler = (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.key === "f") { setFollow(f => !f); e.preventDefault(); }
      if (e.key === "[" || e.key === "]") {
        const ix = levels.indexOf(level);
        setLevel(levels[(ix + (e.key === "]" ? 1 : -1) + levels.length) % levels.length]);
        e.preventDefault();
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [level]);

  useEffect(() => { if (follow && ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [rows, follow]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8, height: "100%" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
        {levels.map(l => (
          <button key={l} onClick={() => setLevel(l)}
            style={{
              background: l === level ? "var(--accent-faint)" : "transparent",
              border: `1px solid ${l === level ? "var(--accent-dim)" : "var(--border)"}`,
              color: l === level ? "var(--accent)" : (LOG_LEVEL_META[l]?.color || "var(--text-dim)"),
              fontFamily: "var(--mono)", fontSize: 11.5,
              padding: "3px 9px", cursor: "pointer", borderRadius: 2,
            }}>{l}</button>
        ))}
        <span style={{ marginLeft: 4, fontSize: 10.5, color: "var(--text-mute)" }}>[ ] cycle</span>
        <div style={{ flex: 1 }} />
        <button onClick={() => setFollow(f => !f)}
          style={{
            background: follow ? "var(--accent-faint)" : "transparent",
            border: `1px solid ${follow ? "var(--accent-dim)" : "var(--border)"}`,
            color: follow ? "var(--accent)" : "var(--text-dim)",
            fontFamily: "var(--mono)", fontSize: 11.5, padding: "3px 9px", cursor: "pointer", borderRadius: 2,
          }}>
          {follow ? "● following" : "○ paused"}
        </button>
        <Key k="f" label="toggle" />
        <Key k="c" label="clear" />
        <Key k="s" label="save" />
      </div>
      <Panel title="daemon.log" right={<span style={{ color: "var(--text-faint)" }}>~/.multica/daemon.log</span>} style={{ flex: 1, minHeight: 0 }} pad={0} scrollable contentRef={ref}>
        <div style={{ fontFamily: "var(--mono)", fontSize: 12.5, padding: "8px 14px" }}>
          {rows.map((l, i) => {
            const c = LOG_LEVEL_META[l[1]]?.color || "var(--text-dim)";
            return (
              <div key={i} style={{ display: "grid", gridTemplateColumns: "70px 56px 80px 1fr", gap: 8, padding: "1.5px 0" }}>
                <span style={{ color: "var(--text-mute)" }} className="tui-num">{l[0]}</span>
                <span style={{ color: c, fontWeight: l[1] === "ERROR" ? 600 : 400 }}>{l[1]}</span>
                <span style={{ color: "var(--text-faint)" }}>{l[2]}</span>
                <span style={{ color: "var(--text-dim)" }}>{l[3]}</span>
              </div>
            );
          })}
          {follow && (
            <div style={{ marginTop: 4, color: "var(--text-faint)" }}>
              <span className="tui-caret" style={{ color: "var(--accent)" }}>▌</span>
              <span style={{ marginLeft: 4 }}>tailing…</span>
            </div>
          )}
        </div>
      </Panel>
    </div>
  );
}

function CommandPalette({ onClose }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  const items = useMemo(() => PALETTE_ITEMS.filter(i => (i.k + " " + i.label).toLowerCase().includes(q.toLowerCase())), [q]);
  useEffect(() => { setSel(0); }, [q]);

  return (
    <div onClick={onClose} style={{
      position: "absolute", inset: 0, background: "rgba(0,0,0,0.55)",
      display: "flex", justifyContent: "center", alignItems: "flex-start", paddingTop: 100, zIndex: 50,
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        width: 620, background: "var(--bg)",
        border: "1px solid var(--accent-dim)",
        boxShadow: "0 12px 60px rgba(0,0,0,0.6)",
        fontFamily: "var(--mono)",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 14px", borderBottom: "1px solid var(--border)" }}>
          <span style={{ color: "var(--accent)", fontSize: 14 }}>:</span>
          <input autoFocus value={q} onChange={e => setQ(e.target.value)}
            placeholder="run a command…"
            style={{ flex: 1, background: "transparent", border: 0, outline: 0, color: "var(--text)", fontFamily: "var(--mono)", fontSize: 14 }} />
          <span className="tui-caret" style={{ color: "var(--accent)" }}>▌</span>
          <span style={{ color: "var(--text-faint)", fontSize: 11 }}>esc to close</span>
        </div>
        <div style={{ maxHeight: 320, overflowY: "auto" }}>
          {items.map((it, i) => (
            <div key={it.k} onClick={onClose}
              onMouseEnter={() => setSel(i)}
              style={{
                display: "grid", gridTemplateColumns: "70px 1fr 90px", gap: 10,
                padding: "8px 14px",
                background: i === sel ? "var(--accent-faint)" : "transparent",
                borderLeft: `2px solid ${i === sel ? "var(--accent)" : "transparent"}`,
                cursor: "pointer", fontSize: 13,
              }}>
              <span style={{ color: "var(--text-faint)", textTransform: "uppercase", letterSpacing: "0.05em", fontSize: 10.5 }}>{it.kind}</span>
              <span><span style={{ color: "var(--accent)" }}>:</span><span style={{ color: "var(--text)" }}>{it.k}</span></span>
              <span style={{ color: "var(--text-faint)", textAlign: "right" }}>{it.label}</span>
            </div>
          ))}
          {items.length === 0 && <div style={{ padding: 16, color: "var(--text-faint)" }}>no command matches "{q}"</div>}
        </div>
        <div style={{ display: "flex", gap: 16, padding: "8px 14px", borderTop: "1px solid var(--border)", color: "var(--text-faint)", fontSize: 11 }}>
          <span>↑↓ select</span>
          <span>↵ run</span>
          <span>esc close</span>
        </div>
      </div>
    </div>
  );
}

const ONBOARD_STEPS = [
  { id: "server",     title: "Server",         sub: "Where does your daemon talk to?" },
  { id: "auth",       title: "Authenticate",   sub: "Sign in to discover your workspaces" },
  { id: "workspaces", title: "Workspaces",     sub: "Pick the ones this daemon should watch" },
  { id: "runtimes",   title: "Agent CLIs",     sub: "We found these on your PATH" },
  { id: "daemon",     title: "Daemon tuning",  sub: "Sensible defaults — tweak if you like" },
  { id: "review",     title: "Review & start", sub: "We'll write ~/.multica and launch the daemon" },
];

function OnboardingView({ onFinish }) {
  const [step, setStep] = useState(0);
  const cur = ONBOARD_STEPS[step];

  return (
    <div style={{ height: "100%", display: "grid", gridTemplateColumns: "260px 1fr", gap: 12 }}>
      <Panel title="first-run setup" right={<span style={{ color: "var(--accent)" }}>◆</span>}>
        <div style={{ fontSize: 12.5, lineHeight: 1.6 }}>
          {ONBOARD_STEPS.map((s, i) => {
            const done   = i < step;
            const active = i === step;
            return (
              <div key={s.id} onClick={() => setStep(i)} className="tui-row"
                style={{
                  padding: "8px 10px", cursor: "pointer",
                  borderLeft: `2px solid ${active ? "var(--accent)" : "transparent"}`,
                  background: active ? "var(--accent-faint)" : "transparent",
                }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{
                    color: done ? "var(--ok)" : active ? "var(--accent)" : "var(--text-mute)",
                    fontSize: 13, width: 16,
                  }}>{done ? "✓" : active ? "▸" : `${i + 1}`}</span>
                  <span style={{ color: active ? "var(--accent)" : done ? "var(--text-dim)" : "var(--text-faint)" }}>{s.title}</span>
                </div>
                {active && <div style={{ paddingLeft: 26, color: "var(--text-faint)", fontSize: 11.5, marginTop: 2 }}>{s.sub}</div>}
              </div>
            );
          })}
          <div style={{ marginTop: 18, padding: 10, border: "1px dashed var(--border)", fontSize: 11.5, color: "var(--text-faint)" }}>
            this writes to <span style={{ color: "var(--text-dim)" }}>~/.multica/profiles/default/config.toml</span>
            <br /> you can edit it later from the Config tab.
          </div>
        </div>
      </Panel>

      <Panel title={`step ${step + 1} / ${ONBOARD_STEPS.length}  ·  ${cur.title}`}
        right={
          <span style={{ display: "inline-flex", gap: 14 }}>
            {step > 0 && <Key k="←" label="back" onClick={() => setStep(s => Math.max(0, s - 1))} />}
            {step < ONBOARD_STEPS.length - 1 && <Key k="→" label="next" accent onClick={() => setStep(s => Math.min(ONBOARD_STEPS.length - 1, s + 1))} />}
            {step === ONBOARD_STEPS.length - 1 && <Key k="↵" label="launch daemon" accent onClick={onFinish} />}
          </span>
        }
        style={{ minHeight: 0 }} scrollable>
        <div style={{ fontSize: 13, lineHeight: 1.6 }}>
          {cur.id === "server"     && <StepServer />}
          {cur.id === "auth"       && <StepAuth />}
          {cur.id === "workspaces" && <StepWorkspaces />}
          {cur.id === "runtimes"   && <StepRuntimes />}
          {cur.id === "daemon"     && <StepDaemon />}
          {cur.id === "review"     && <StepReview />}
        </div>
      </Panel>
    </div>
  );
}

  workspaces: [["j k", "row"], ["w", "watch"], ["m", "members"], ["o", "browser"], ["?", "help"]],
  logs:       [["f", "follow"], ["[ ]", "level"], ["c", "clear"], ["s", "save"], ["?", "help"]],
  config:     [["j k", "row"], ["e", "edit"], ["↵", "reload daemon"], ["?", "help"]],
  help:       [["?", "close"], ["esc", "close"]],
  onboarding: [["← →", "step"], ["space", "toggle"], ["↵", "next"], ["esc", "skip"]],
};

const DAEMON = { pid: 48132, profile: "default", uptime: "4h 32m 18s", version: "0.18.2" };

/* ───────────────────────────────────────────────────────────────────────────
 * App
 * ─────────────────────────────────────────────────────────────────────────── */
function App() {
  const [route, setRoute] = useState("overview");
  const [attachId, setAttachId] = useState(null);
  const [help, setHelp] = useState(false);
  const [palette, setPalette] = useState(false);
  const [onboarding, setOnboarding] = useState(false);
  const [sessionsFilter, setSessionsFilter] = useState(null);

  useEffect(() => {
    const onKey = (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") {
        if (e.key === "Escape") e.target.blur();
        return;
      }
      if (onboarding) {
        if (e.key === "Escape") setOnboarding(false);
        return;
      }
      if (e.key === "?") { setHelp(h => !h); return; }
      if (e.key === ":") { setPalette(true); e.preventDefault(); return; }
      if (e.key === "Escape") {
        if (palette) setPalette(false);
        else if (help) setHelp(false);
        else if (attachId) setAttachId(null);
        return;
      }
      if (e.key >= "1" && e.key <= "7") {
        const r = ROUTES.find(r => r.key === e.key);
        if (r) { setRoute(r.id); setAttachId(null); }
        return;
      }
      if (e.key === "Tab") {
        e.preventDefault();
        const idx = ROUTES.findIndex(r => r.id === route);
        const next = (idx + (e.shiftKey ? -1 : 1) + ROUTES.length) % ROUTES.length;
        setRoute(ROUTES[next].id);
        setAttachId(null);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [route, help, palette, attachId, onboarding]);

  const handleJump = useCallback((dest, opts = {}) => {
    if (dest === "sessions") setSessionsFilter(opts.filter || null);
    setRoute(dest);
  }, []);

  const currentHint = onboarding ? STATUS_HINTS.onboarding
                    : help        ? STATUS_HINTS.help
                    : attachId    ? STATUS_HINTS.attach
                    :               STATUS_HINTS[route];

  return (
    <div style={{
      width: "100vw",
      height: "100vh",
      background: "var(--bg)",
      overflow: "hidden",
      display: "flex", flexDirection: "column",
      position: "relative",
      fontFamily: "var(--mono)",
    }}>
      <TopBar daemon={DAEMON} attachId={attachId} />
      <TabBar route={route} setRoute={(r) => { setRoute(r); setAttachId(null); }} attachId={attachId} setAttachId={setAttachId} setHelp={setHelp} help={help} />

      <div style={{ flex: 1, padding: 12, minHeight: 0, position: "relative", overflow: "hidden" }}>
        {onboarding ? (
          <OnboardingView onFinish={() => setOnboarding(false)} />
        ) : help ? (
          <HelpView onClose={() => setHelp(false)} />
        ) : attachId ? (
          <SessionAttachView sessionId={attachId} onDetach={() => setAttachId(null)} />
        ) : route === "overview"   ? <OverviewView daemon={DAEMON} onJump={handleJump} />
          : route === "sessions"   ? <SessionsView initialFilter={sessionsFilter} onAttach={(id) => setAttachId(id)} />
          : route === "issues"     ? <IssuesView />
          : route === "runtimes"   ? <RuntimesView />
          : route === "workspaces" ? <WorkspacesView />
          : route === "logs"       ? <LogsView />
          : route === "config"     ? <ConfigView />
          : null}
      </div>

      <StatusBar hints={currentHint} daemon={DAEMON} />

      {palette && <CommandPalette onClose={() => setPalette(false)} />}

      {!onboarding && (
        <button
          onClick={() => setOnboarding(true)}
          title="replay first-run setup"
          style={{
            position: "absolute", bottom: 38, right: 10,
            background: "transparent", border: "1px solid var(--border)",
            color: "var(--text-faint)", fontFamily: "var(--mono)", fontSize: 10,
            padding: "2px 8px", cursor: "pointer", borderRadius: 2,
          }}>
          replay onboarding
        </button>
      )}
    </div>
  );
}

/* ───────────────────────────────────────────────────────────────────────────
 * Top bar — daemon health, server, env quick-glance
 * ─────────────────────────────────────────────────────────────────────────── */
function TopBar({ daemon, attachId }) {
  const now = useClock();
  const ts = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  const needsInput = SESSIONS.filter(s => s.state === "needs_input").length;
  const working    = SESSIONS.filter(s => s.state === "working" || s.state === "running").length;

  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 14,
      padding: "8px 14px",
      background: "var(--bg)",
      borderBottom: "1px solid var(--border)",
      fontSize: 12,
      flexShrink: 0,
    }}>
      <BrandMark />
      <span style={{ color: "var(--text-mute)" }}>│</span>
      <span style={{ display: "inline-flex", alignItems: "center", gap: 7 }}>
        <Dot color="var(--ok)" />
        <span style={{ color: "var(--ok)", fontWeight: 600 }}>daemon up</span>
        <span style={{ color: "var(--text-faint)" }} className="tui-num">{daemon.uptime}</span>
      </span>
      <span style={{ color: "var(--text-mute)" }}>│</span>
      <span style={{ color: "var(--text-faint)" }}>profile</span>
      <span style={{ color: "var(--accent)" }}>{daemon.profile}</span>
      <span style={{ color: "var(--text-faint)" }}>· srv</span>
      <span style={{ color: "var(--text-dim)" }}>app.multica.ai</span>
      <span style={{ color: "var(--ok)" }} className="tui-num">↑ 38ms</span>

      <div style={{ flex: 1 }} />

      {needsInput > 0 && (
        <span style={{ display: "inline-flex", alignItems: "center", gap: 6, color: "var(--warn)" }}>
          <span style={{ color: "var(--warn)", width: 14, textAlign: "center", display: "inline-block" }}>◆</span>
          <span style={{ fontWeight: 600 }} className="tui-num">{needsInput}</span>
          <span>need you</span>
        </span>
      )}
      <span style={{ color: "var(--text-faint)" }}>· <span className="tui-num" style={{ color: "var(--info)" }}>{working}</span> working</span>
      <span style={{ color: "var(--text-mute)" }}>│</span>
      <span style={{ color: "var(--text-dim)" }} className="tui-num">cpu 18% · mem 41%</span>
      <span style={{ color: "var(--text-mute)" }}>│</span>
      <span style={{ color: "var(--text)" }} className="tui-num">{ts}</span>
    </div>
  );
}

/* ───────────────────────────────────────────────────────────────────────────
 * Tab bar
 * ─────────────────────────────────────────────────────────────────────────── */
function TabBar({ route, setRoute, attachId, setAttachId, setHelp, help }) {
  return (
    <div style={{
      display: "flex", gap: 2, alignItems: "center",
      padding: "0 8px",
      background: "var(--bg-2)",
      borderBottom: "1px solid var(--border)",
      flexShrink: 0,
    }}>
      {ROUTES.map(r => {
        const active = !help && !attachId && r.id === route;
        return (
          <button key={r.id} className={`tui-tab ${active ? "active" : ""}`}
            onClick={() => { setRoute(r.id); setHelp(false); }}
            style={{
              position: "relative",
              background: "transparent", border: 0,
              padding: "9px 12px",
              fontFamily: "var(--mono)", fontSize: 12.5,
              color: active ? "var(--accent)" : "var(--text-faint)",
              cursor: "pointer",
              display: "inline-flex", alignItems: "center", gap: 6,
            }}>
            <span style={{
              fontSize: 10, padding: "0 5px",
              border: `1px solid ${active ? "var(--accent-dim)" : "var(--border)"}`,
              color: active ? "var(--accent)" : "var(--text-mute)",
              borderRadius: 2, lineHeight: "15px",
            }}>{r.key}</span>
            <span>{r.label}</span>
            {r.id === "sessions" && (() => {
              const n = SESSIONS.filter(s => s.state === "needs_input").length;
              return n > 0 ? <span style={{ color: "var(--warn)", fontSize: 10 }}>◆{n}</span> : null;
            })()}
          </button>
        );
      })}
      <div style={{ flex: 1 }} />
      {attachId && (
        <button onClick={() => setAttachId(null)} className="tui-tab active"
          style={{
            position: "relative", background: "transparent", border: 0,
            padding: "9px 12px", fontFamily: "var(--mono)", fontSize: 12.5,
            color: "var(--accent)", cursor: "pointer",
            display: "inline-flex", alignItems: "center", gap: 6,
          }}>
          <span style={{ color: "var(--accent)" }}>● attached · {attachId}</span>
          <span style={{ color: "var(--text-faint)", fontSize: 10 }}>(← detach)</span>
        </button>
      )}
      <button onClick={() => setHelp(h => !h)} className={`tui-tab ${help ? "active" : ""}`}
        style={{
          position: "relative", background: "transparent", border: 0,
          padding: "9px 12px", fontFamily: "var(--mono)", fontSize: 12.5,
          color: help ? "var(--accent)" : "var(--text-faint)", cursor: "pointer",
          display: "inline-flex", alignItems: "center", gap: 6,
        }}>
        <span style={{
          fontSize: 10, padding: "0 5px",
          border: `1px solid ${help ? "var(--accent-dim)" : "var(--border)"}`,
          color: help ? "var(--accent)" : "var(--text-mute)",
          borderRadius: 2, lineHeight: "15px",
        }}>?</span>
        <span>Help</span>
      </button>
    </div>
  );
}

/* ───────────────────────────────────────────────────────────────────────────
 * Status bar — contextual key hints + meta
 * ─────────────────────────────────────────────────────────────────────────── */
function StatusBar({ hints, daemon }) {
  const seen = new Set();
  const safe = hints.filter(([k]) => {
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });

  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 12,
      padding: "6px 14px",
      background: "var(--bg-2)",
      borderTop: "1px solid var(--border)",
      fontSize: 11.5, flexShrink: 0,
    }}>
      {safe.map(([k, l], i) => (
        <span key={i} style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
          <span style={{
            padding: "0 5px",
            background: "var(--surface-2)",
            border: "1px solid var(--border)",
            color: "var(--text)",
            fontWeight: 600,
            borderRadius: 2,
            fontSize: 10.5, lineHeight: "15px",
          }}>{k}</span>
          <span style={{ color: "var(--text-faint)" }}>{l}</span>
        </span>
      ))}
      <div style={{ flex: 1 }} />
      <span style={{ color: "var(--text-mute)" }}>multica-tui v{daemon.version}</span>
      <span style={{ color: "var(--text-mute)" }}>·</span>
      <span style={{ color: "var(--text-mute)" }} className="tui-num">pid {daemon.pid}</span>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
